<!DOCTYPE html>
<html lang="el" data-lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Το ιδιωτικό περιβάλλον της Nelyce. Δες το Instagram grid σου όπως θα φαίνεται στο προφίλ, σχολίασε και ζήτησε αλλαγές.">
    <meta name="theme-color" content="#0a0a0e">

    <!-- What a messenger shows when this link is sent ------------------- -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Nelyce">
    <meta property="og:locale" content="el_GR">
    <meta property="og:url" content="https://www.nelyce-partners.eu/login.html">
    <meta property="og:title" content="Nelyce Portal">
    <meta property="og:description" content="Το ιδιωτικό περιβάλλον της Nelyce. Δες το Instagram grid σου όπως θα φαίνεται στο προφίλ, σχολίασε και ζήτησε αλλαγές.">
    <meta property="og:image" content="https://www.nelyce-partners.eu/images/og-portal.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Σκούρα οθόνη με το λογότυπο Nelyce και ένα grid από φωτογραφίες σε στήλες, όπως στο Instagram.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Nelyce Portal">
    <meta name="twitter:description" content="Το ιδιωτικό περιβάλλον της Nelyce. Δες το Instagram grid σου όπως θα φαίνεται στο προφίλ, σχολίασε και ζήτησε αλλαγές.">
    <meta name="twitter:image" content="https://www.nelyce-partners.eu/images/og-portal.jpg">
    <title>Είσοδος | Nelyce Portal</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="css/style.min.css"/>
    <link type="text/css" rel="stylesheet" href="css/login.css"/>
</head>
<body class="login-body">

    <div class="gradient-bg">
        <div class="gradients-container">
            <div class="g1"></div>
            <div class="g2"></div>
            <div class="g3"></div>
            <div class="g4"></div>
            <div class="g5"></div>
        </div>
    </div>
    <div class="mesh-gradient-scrim"></div>

    <main class="login-main">
        <div class="login-card">
            <img src="https://www.nelycedesign.com/assets/img/logo.svg" alt="Nelyce Design"
                 width="273" height="58" class="login-logo">

            <!-- Step one: which door ---------------------------------------->
            <section class="login-step" id="step-role">
                <h1 class="login-title">Καλώς ήρθες</h1>
                <p class="login-sub">Διάλεξε πώς μπαίνεις και σε πάμε στο περιβάλλον σου.</p>

                <div class="role-choices">
                    <button class="role-choice" type="button" data-role="partner">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </span>
                        <span class="role-name">Συνεργάτης</span>
                        <span class="role-note">Δουλεύω τις σελίδες των πελατών μου</span>
                    </button>

                    <button class="role-choice" type="button" data-role="client">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
                        </span>
                        <span class="role-name">Πελάτης</span>
                        <span class="role-note">Βλέπω τη σελίδα μου και αφήνω σχόλια</span>
                    </button>
                </div>
            </section>

            <!-- Step two: who ------------------------------------------------>
            <section class="login-step" id="step-credentials" hidden>
                <button class="login-back" type="button" id="login-back">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
                    <span id="login-role-label">Συνεργάτης</span>
                </button>

                <h1 class="login-title">Είσοδος</h1>
                <p class="login-sub">Βάλε τα στοιχεία που σου δώσαμε.</p>

                <form class="login-form" id="login-form" autocomplete="on">
                    <label class="login-label" for="login-username">Όνομα χρήστη</label>
                    <input class="login-input" id="login-username" name="username" type="text"
                           autocomplete="username" autocapitalize="none" spellcheck="false" required>

                    <label class="login-label" for="login-password">Κωδικός</label>
                    <input class="login-input" id="login-password" name="password" type="password"
                           autocomplete="current-password" required>

                    <p class="login-error" id="login-error" role="alert" hidden></p>

                    <button class="btn btn-primary login-submit" id="login-submit" type="submit">Είσοδος</button>
                </form>
            </section>

            <p class="login-foot">Τους λογαριασμούς τους ανοίγει η Nelyce. Αν χρειάζεσαι πρόσβαση, γράψε μας.</p>
        </div>
    </main>

    <script type="text/javascript" src="js/login.js" defer></script>
</body>
</html>
