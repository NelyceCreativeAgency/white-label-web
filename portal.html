<!DOCTYPE html>
<html lang="el" data-lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Διαμόρφωσε τις υπηρεσίες που χρειάζεσαι και δες κόστος αμέσως.">
    <title>Client Portal | Nelyce</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet"></noscript>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
<link type="text/css" rel="stylesheet" href="css/portal.css"/>
</head>
<body>

<main class="portal-main">

    <section class="portal-hero">
        <span class="demo-flag">Demo — οι τιμές είναι ενδεικτικές</span>
        <h1>Φτιάξε την προσφορά σου</h1>
        <p>Διάλεξε τις υπηρεσίες που χρειάζεσαι, ρύθμισέ τες στα μέτρα σου και δες το κόστος καθώς προχωράς.</p>

        <div class="market-switch">
            <div id="market-toggle" role="group" aria-label="Αγορά">
                <button type="button" data-market="GR" class="is-active">Ελλάδα</button>
                <button type="button" data-market="INT">Εκτός Ελλάδας</button>
            </div>
        </div>
    </section>

    <div class="portal-body">
        <div class="portal-catalogue">
            <nav id="cat-nav" aria-label="Κατηγορίες"></nav>
            <div id="service-grid"></div>
        </div>

        <aside id="quote-summary" aria-live="polite"></aside>
    </div>

</main>

<script type="text/javascript" src="js/portal-data.js" defer></script>
<script type="text/javascript" src="js/portal.js" defer></script>
</body>
</html>
